[package]
name = "battle-city"
version = "0.1.0"
edition = "2024"

[dependencies]
# 2D-only Bevy: drops 3D/PBR/glTF. `mp3` is needed for levels/background.mp3.
bevy = { version = "0.18.1", default-features = false, features = ["2d", "ui", "mp3", "default_font", "bevy_state"] }
bevy_ggrs = "0.21"
matchbox_socket = "0.14"
serde = { version = "1", features = ["derive"] }
rand = "0.9"
serde_json = "1"
bincode = "1"
ron = "0.9"

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
instant = { version = "0.1", features = ["wasm-bindgen"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Release profile tuned for the WASM bundle size budget (~15 MB).
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
